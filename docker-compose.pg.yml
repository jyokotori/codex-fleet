services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: codex-fleet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codexfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codexfleet}
      POSTGRES_DB: ${POSTGRES_DB:-codexfleet}
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codexfleet} -d ${POSTGRES_DB:-codexfleet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: codex-fleet_postgres_data
