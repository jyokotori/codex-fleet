services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_ssh:/root/.ssh
    env_file: .env
    # Allow `POSTGRES_HOST=host.docker.internal` to reach pg exposed on host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  app_ssh:
